name: Twitter Viral Watcher

on:
  schedule:
    - cron: "*/20 * * * *" # هر ۲۰ دقیقه اجرا شود
  workflow_dispatch:

permissions:
  contents: write # بسیار مهم برای ذخیره فایل sent.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests pytz

      - name: Run Twitter Bot
        env:
          BALE_TOKEN: ${{ secrets.BALE_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python twitter_bot.py

      - name: Commit and Push if database changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sent.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update sent posts database" && git push)
